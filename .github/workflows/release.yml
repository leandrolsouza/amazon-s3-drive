name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  installers:
    needs: tests
    name: Installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: appimage,deb
          - os: windows-latest
            bundles: msi,nsis
          - os: macos-latest
            bundles: dmg
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Check release version
        run: |
          node -e '
            const { version } = require("./src-tauri/tauri.conf.json");
            const tag = process.env.GITHUB_REF_NAME;
            if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version) || tag !== `v${version}`) {
              throw new Error(`Expected a vMAJOR.MINOR.PATCH tag matching the Tauri version (${version}); got ${tag}`);
            }
          '
        shell: bash

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf xdg-utils

      - run: rustup update stable
      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          RUSTUP_TOOLCHAIN: stable
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          args: --bundles ${{ matrix.bundles }} -- --locked
          uploadWorkflowArtifacts: true

  draft:
    needs: installers
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create draft prerelease
        run: |
          gh run download "$GITHUB_RUN_ID" --dir artifacts
          shopt -s globstar nullglob
          assets=(artifacts/**/*.msi artifacts/**/*.exe artifacts/**/*.dmg artifacts/**/*.deb artifacts/**/*.AppImage)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --draft --prerelease --title "$GITHUB_REF_NAME" --generate-notes
